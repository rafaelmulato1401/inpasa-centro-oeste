<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0d2044,#1a3a6b);color:#1a2a44}
.box{background:#fff;border-radius:14px;width:100%;max-width:400px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.4);border-top:5px solid #f0a500}
.logo{display:block;height:44px;margin:0 auto 14px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;text-align:center;color:#0d2044;letter-spacing:.5px}
.sub{text-align:center;font-size:13px;color:#667;margin-bottom:18px}
.tabs{display:flex;margin-bottom:16px;border-bottom:2px solid #e3e8f0}
.tabs button{flex:1;padding:10px;background:none;border:none;font:600 14px 'Barlow';color:#889;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:#0d2044;border-color:#f0a500}
label{display:block;font-size:12px;font-weight:600;color:#445;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;padding:11px 12px;border:1.5px solid #cfd7e6;border-radius:8px;font:15px 'Barlow'}
input:focus{outline:none;border-color:#1a3a6b}
.btn{width:100%;margin-top:18px;padding:12px;border:none;border-radius:8px;background:#f0a500;color:#0d2044;font:700 16px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;display:none}
.msg.err{display:block;background:#fdecec;color:#a12626}
.msg.ok{display:block;background:#e8f6ee;color:#1d6b3e}
.msg.info{display:block;background:#fff6e0;color:#8a5a00}
.link{display:block;text-align:center;margin-top:12px;font-size:13px;color:#1a3a6b;cursor:pointer;background:none;border:none;width:100%}
.hide{display:none}
</style>

  <h1>OPERAÇÃO CENTRO OESTE</h1>
  <p class="sub">Acesso restrito a usuários autorizados</p>

  <div class="tabs">
    <button id="tLogin" class="on" type="button">Entrar</button>
    <button id="tReg" type="button">Solicitar acesso</button>
  </div>

  <form id="fLogin">
    <label>E-mail</label><input id="lEmail" type="email" required autocomplete="username">
    <label>Senha</label><input id="lPass" type="password" required autocomplete="current-password">
    <button class="btn" type="submit">Entrar</button>
    <button class="link" id="forgot" type="button">Esqueci minha senha</button>
  </form>

  <form id="fReg" class="hide">
    <label>Nome completo</label><input id="rNome" required maxlength="80" autocomplete="name">
    <label>E-mail</label><input id="rEmail" type="email" required autocomplete="username">
    <label>Senha (mín. 6 caracteres)</label><input id="rPass" type="password" required minlength="6" autocomplete="new-password">
    <button class="btn" type="submit">Solicitar acesso</button>
  </form>

  <div id="msg" class="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const $ = (id) => document.getElementById(id);

// destino pós-login: só arquivos locais simples (evita open redirect)
let next = new URLSearchParams(location.search).get("next") || "index.html";
if (!/^[A-Za-z0-9_\-]+\.html$/.test(next)) next = "index.html";

function msg(text, type) { const m = $("msg"); m.textContent = text; m.className = "msg " + type; }
function tab(reg) {
  $("fLogin").classList.toggle("hide", reg); $("fReg").classList.toggle("hide", !reg);
  $("tLogin").classList.toggle("on", !reg); $("tReg").classList.toggle("on", reg);
  $("msg").className = "msg";
}
$("tLogin").onclick = () => tab(false);
$("tReg").onclick = () => tab(true);

const STATUS = {
  pendente: ["Seu cadastro aguarda aprovação de um administrador.", "info"],
  rejeitado: ["Sua solicitação de acesso foi recusada.", "err"],
  bloqueado: ["Seu acesso está bloqueado. Fale com o administrador.", "err"],
  "sem-cadastro": ["Cadastro não encontrado. Solicite acesso.", "err"],
  erro: ["Erro ao verificar o acesso. Tente novamente.", "err"]
};
const q = new URLSearchParams(location.search).get("msg");
if (q && STATUS[q]) msg(...STATUS[q]);

function erroAuth(e) {
  const c = e.code || "";
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email"].includes(c)) return "E-mail ou senha incorretos.";
  if (c === "auth/email-already-in-use") return "Este e-mail já possui cadastro. Use a aba Entrar.";
  if (c === "auth/weak-password") return "Senha muito fraca (mínimo 6 caracteres).";
  if (c === "auth/too-many-requests") return "Muitas tentativas. Aguarde alguns minutos.";
  return "Erro: " + (c || e.message);
}

$("fLogin").onsubmit = async (ev) => {
  ev.preventDefault();
  const btn = ev.submitter; btn.disabled = true;
  try {
    const cred = await signInWithEmailAndPassword(auth, $("lEmail").value.trim(), $("lPass").value);
    const snap = await getDoc(doc(db, "usuarios", cred.user.uid));
    const st = snap.exists() ? snap.data().status : "sem-cadastro";
    if (st !== "aprovado") { await signOut(auth); msg(...STATUS[st]); }
    else location.replace(next);
  } catch (e) { msg(erroAuth(e), "err"); }
  btn.disabled = false;
};

$("fReg").onsubmit = async (ev) => {
  ev.preventDefault();
  const btn = ev.submitter; btn.disabled = true;
  try {
    const email = $("rEmail").value.trim();
    const cred = await createUserWithEmailAndPassword(auth, email, $("rPass").value);
    await setDoc(doc(db, "usuarios", cred.user.uid), {
      nome: $("rNome").value.trim(), email, status: "pendente", perfil: "usuario", criadoEm: serverTimestamp()
    });
    await signOut(auth);
    $("fReg").reset(); tab(false);
    msg("Solicitação enviada! Aguarde a aprovação de um administrador para entrar.", "ok");
  } catch (e) { msg(erroAuth(e), "err"); }
  btn.disabled = false;
};

$("forgot").onclick = async () => {
  const email = $("lEmail").value.trim();
  if (!email) return msg("Digite seu e-mail acima e clique novamente.", "info");
  try { await sendPasswordResetEmail(auth, email); msg("Enviamos um link de redefinição para o seu e-mail.", "ok"); }
  catch (e) { msg(erroAuth(e), "err"); }
};
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
